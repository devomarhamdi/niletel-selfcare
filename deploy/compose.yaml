# Start everything:   cp deploy/.env.example deploy/.env   (edit the passwords)
#                     docker compose -f deploy/compose.yaml up --build
# Start from empty databases:  docker compose -f deploy/compose.yaml down -v
name: niletel-selfcare

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy deploy/.env.example to deploy/.env}
      BSS_DB_PASSWORD: ${BSS_DB_PASSWORD:?copy deploy/.env.example to deploy/.env}
      SELFCARE_DB_PASSWORD: ${SELFCARE_DB_PASSWORD:?copy deploy/.env.example to deploy/.env}
      TZ: Africa/Cairo
      PGTZ: Africa/Cairo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ../db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # No ports: entry. Only selfcare-api reaches it, at http://bss-core:8080/bss-core/api
  bss-core:
    build: ../bss-core
    environment:
      BSS_DB_URL: jdbc:postgresql://postgres:5432/bss_core
      BSS_DB_USER: bss_app
      BSS_DB_PASSWORD: ${BSS_DB_PASSWORD:?copy deploy/.env.example to deploy/.env}
      TZ: Africa/Cairo
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  selfcare-api:
    build: ../selfcare-api
    environment:
      SELFCARE_DB_URL: jdbc:postgresql://postgres:5432/selfcare
      SELFCARE_DB_USER: selfcare_app
      SELFCARE_DB_PASSWORD: ${SELFCARE_DB_PASSWORD:?copy deploy/.env.example to deploy/.env}
      TZ: Africa/Cairo
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      bss-core:
        condition: service_healthy
    restart: unless-stopped

  selfcare-web:
    build: ../selfcare-web
    ports:
      - "5500:80"
    depends_on:
      selfcare-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
