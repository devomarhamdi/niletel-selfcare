spring.application.name=selfcare-api
server.port=8081

# The selfcare database: its own user, no access to bss_core. The password comes from the environment.
spring.datasource.url=${SELFCARE_DB_URL:jdbc:postgresql://localhost:5432/selfcare}
spring.datasource.username=${SELFCARE_DB_USER:selfcare_app}
spring.datasource.password=${SELFCARE_DB_PASSWORD:}

# JPA maps to the schema made by the SQL scripts; it never creates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health for probes: only /actuator/health is exposed, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
